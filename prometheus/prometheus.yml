global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  # Common rules (always load)
  - "alert_rules_common.yml"
  # Choose ONE of the following based on your plant type:
  - "alert_rules_eurodocsis.yml"
  # - "alert_rules_docsis_us.yml"
  # If using OTLP metrics via an OTel Collector → Prometheus backend,
  # use the OTLP rules instead of the above three files:
  # - "alert_rules_otlp.yml"

scrape_configs:
  - job_name: "cm3500"
    static_configs:
      # "exporter:10044" is the Compose service name. For a host install,
      # change this to 127.0.0.1:10044 (the exporter's default listen address).
      - targets: ["exporter:10044"]
    scrape_interval: 30s
